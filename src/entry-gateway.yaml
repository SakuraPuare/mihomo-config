# ============================================================
# entry-gateway.yaml —— 网关差异段(iptables REDIRECT 模式)
# build.sh 会把 __CONTROLLER_SECRET__ 替换成 secrets.local.env 的真实值
# ============================================================

# VyOS iptables REDIRECT 把 LAN TCP 重定向到此端口
# ⚠️ 不能用 tproxy-port: VyOS kernel 6.18 的 nft_tproxy socket lookup 有 bug
redir-port: 12345
mixed-port: 7890
allow-lan: true
bind-address: "*"
authentication: [""]

# 面板:沿用现状,经 socat 9090 -> :9999 暴露到 LAN(勿公网暴露)
external-controller: :9999
external-ui: ui
secret: "__CONTROLLER_SECRET__"

# tun 在网关不启用(走 iptables REDIRECT)
tun:
  enable: false
