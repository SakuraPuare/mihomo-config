# 机场槽位 + 优先级。每行一个槽位,行序 = fallback 优先级(第一行最高)。
# 订阅 URL 和显示名在本地 secrets.local.env。
#
# 每行格式:  <槽位KEY>  <URL变量名>  <显示名变量名>
#   槽位KEY   : 生成组名用(如 P1-均衡)
#   URL变量名 : secrets.local.env 里的订阅 URL 变量
#   显示名变量: secrets.local.env 里的节点前缀变量(缺省则用槽位KEY)

P1  SUB_P1  NAME_P1
P2  SUB_P2  NAME_P2
P3  SUB_P3  NAME_P3
P4  SUB_P4  NAME_P4
